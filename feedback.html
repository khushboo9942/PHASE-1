<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>

    <header>
        <h1>Feedback Form</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="course.html">Course</a></li>
            <li><a href="feedback.html">Feedback</a></li>
            <li><a href="grades.html">Grades</a></li>
            <li><a href="contact.html">contact</a></li>
        </ul>
    </nav>

    <main>

        <h2>Share your feedback</h2>

        <p>please fill in the form below to share your thoughs about the course and the portal.</p>

        <form>

            <label for="name">Name:</label><br>
            <input type="text" name="name" id="name">
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" name="email" id="email">
            <br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" name="phone" placeholder="enter number" id="phone">
            <br><br>

            <label for="male">Male</label>
            <input type="radio" name="gender" value="male" id="male">

            <label for="female">Female</label>
            <input type="radio" name="gender" value="female" id="female">

            <label for="other">Other</label>
            <input type="radio" name="gender" value="other" id="other">
            <br><br>

            <label for="select">Select course:</label><br>

            <select name="course" id="select">
                <option>HTML & web fundamentals</option>
                <option>Python</option>
                <option>MYSQL</option>
                <option>Java</option>
                <option>C programmimg</option>
            </select>

            <br><br>

            <label for="feedback">Your Feedback:</label><br>

            <textarea name="feedback" rows="7" cols="50" id="feedback"></textarea>

            <br><br>

            <label for="option">Select rating</label>

            <select name="rating" id="option">
                <option>5-Excellent</option>
                <option>4-very goog</option>
                <option>3-Good</option>
                <option>2-Average</option>
                <option>1-poor</option>
            </select>

            <br><br>

            <input type="checkbox" name="subscribe" id="checkbox">
            <label for="checkbox">Subscribe to newsletter and updates</label>

            <br><br>

            <button type="submit">submit</button>
            <input type="reset" value="Reset">

        </form>

    </main>

    <footer>
        <p>&copy;2026 Student Portal.All rights reserved.</p>
    </footer>

</body>
</html>
